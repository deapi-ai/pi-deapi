name: Publish to npm

# Publishes @deapi/pi with npm trusted publishing (OIDC), provenance and staged publishing.
#
# First release: npm only lets you configure a trusted publisher for a package that
# already exists, so the first version (0.1.0) is published manually by a maintainer
# (`npm publish --access public` from a clean checkout). After that, configure the
# trusted publisher on npmjs.com with exactly these values:
#   organization: deapi-ai, repository: pi-deapi, workflow: publish.yml, environment: release
# and allow staged publishing only. Every later version goes through this workflow.
#
# Triggers:
#   - push of a version tag `vX.Y.Z`  -> verify, then stage the version on npm
#   - manual workflow_dispatch         -> verify only (preflight), never publishes
#
# Safety:
#   - `verify` runs with read-only permissions. Only `publish` gets `id-token: write`.
#   - `publish` runs in the `release` environment.
#   - The tag must match package.json `version` and the VERSION in the extension.
#   - No NPM_TOKEN: npm uses the OIDC token. npm is pinned to an explicit version.
#   - `npm stage publish` puts the version in the package's staging queue. A maintainer
#     approves it with 2FA on npmjs.com (package -> Staged Packages) or with
#     `npm stage approve <stage-id>`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual runs are preflight only and never publish.'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: pre-publish checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check versions and package layout
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXT_VERSION=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' extensions/deapi.ts)
          if [ "${EXT_VERSION}" != "${PKG_VERSION}" ]; then
            echo "ERROR: extensions/deapi.ts VERSION '${EXT_VERSION}' does not match package.json '${PKG_VERSION}'."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${PKG_VERSION}" ]; then
            echo "ERROR: tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          node -e "const p = require('./package.json'); if (!p.keywords.includes('pi-package')) throw new Error('missing pi-package keyword');"
          test -f extensions/deapi.ts
          test -f skills/deapi/SKILL.md
          echo "OK: version ${PKG_VERSION}, layout and keyword in place."

      - name: Package contents
        run: npm pack --dry-run

  publish:
    name: stage publish to npm (provenance)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Pin npm to a version that supports staged trusted publishing
        # `npm stage publish` needs npm >= 11.15.0, OIDC trusted publishing needs >= 11.5.1.
        run: npm install -g npm@11.21.2

      - name: Skip if this version is already on npm
        id: already
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already on npm, skipping publish (for example the manual first release)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage publish (provenance, trusted publishing via OIDC)
        if: steps.already.outputs.already != 'true'
        run: npm stage publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag
          fi

      - name: Next step (approve the staged version)
        if: steps.already.outputs.already != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice::${NAME}@${VERSION} is staged. Approve it with 2FA on npmjs.com (package -> Staged Packages) or with 'npm stage approve <stage-id>'."
